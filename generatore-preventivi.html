<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generatore Preventivi — Amira Vision (uso interno)</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0b1f3a; --navy-dark: #061525; --navy-mid: #0d2540;
    --blue: #4da8f0; --blue-dark: #185fa5; --blue-light: #7ec8f7;
    --text-muted: #7a9fc0; --text-light: #a8c8e8; --border: rgba(77,168,240,0.2);
    --panel: #0e1d30; --panel-border: #1c3350;
  }
  body { font-family: 'DM Sans', sans-serif; background: #0a1729; color: #e6eef7; min-height: 100vh; }

  /* TOPBAR */
  .topbar { background: var(--navy-dark); border-bottom: 0.5px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 10px; }
  .topbar-title { display: flex; flex-direction: column; }
  .topbar-title .tt-main { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 15px; color: var(--blue); letter-spacing: 0.15em; }
  .topbar-title .tt-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tb-btn { background: rgba(77,168,240,0.1); border: 0.5px solid rgba(77,168,240,0.3); color: var(--blue-light); font-size: 12.5px; padding: 9px 16px; border-radius: 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
  .tb-btn:hover { background: rgba(77,168,240,0.2); }
  .tb-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .tb-btn.primary:hover { background: var(--blue-dark); }
  #importFile { display: none; }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 440px 1fr; gap: 0; min-height: calc(100vh - 60px); }
  .editor-pane { background: var(--navy-dark); border-right: 0.5px solid var(--border); padding: 24px; overflow-y: auto; max-height: calc(100vh - 60px); }
  .preview-pane-wrap { display: flex; flex-direction: column; max-height: calc(100vh - 60px); }
  .doc-tabs { display: flex; gap: 8px; padding: 14px 24px 0; background: #08141f; flex-shrink: 0; }
  .doc-tab { background: transparent; border: 0.5px solid rgba(77,168,240,0.25); color: var(--text-muted); font-size: 12.5px; padding: 8px 18px; border-radius: 16px 16px 0 0; cursor: pointer; font-family: 'DM Sans', sans-serif; border-bottom: none; }
  .doc-tab.active { background: #08141f; color: var(--blue-light); border-color: rgba(77,168,240,0.4); }
  .preview-pane { background: #08141f; padding: 32px; overflow-y: auto; flex: 1; display: flex; justify-content: center; align-items: flex-start; }
  .view-toggle { display: none; }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .editor-pane, .preview-pane-wrap { max-height: none; }
    .editor-pane.hide, .preview-pane-wrap.hide { display: none; }
    .view-toggle { display: flex; gap: 8px; }
  }

  /* EDITOR FORM */
  .ed-block { margin-bottom: 30px; }
  .ed-block-title { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border); }
  .ed-field { margin-bottom: 12px; }
  .ed-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .ed-input, .ed-textarea, .ed-select { width: 100%; background: rgba(255,255,255,0.04); border: 0.5px solid rgba(77,168,240,0.25); color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 13.5px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
  .ed-input:focus, .ed-textarea:focus, .ed-select:focus { border-color: var(--blue); }
  .ed-textarea { resize: vertical; min-height: 60px; }
  .ed-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ed-row-price { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }

  .repeat-item { background: var(--panel); border: 0.5px solid var(--panel-border); border-radius: 10px; padding: 14px; margin-bottom: 10px; position: relative; }
  .repeat-item-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #5a80a0; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; transition: color 0.2s, background 0.2s; }
  .repeat-item-remove:hover { color: #ff8a8a; background: rgba(255,80,80,0.1); }
  .add-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px dashed rgba(77,168,240,0.4); background: transparent; color: var(--blue-light); font-size: 12.5px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
  .add-btn:hover { background: rgba(77,168,240,0.08); }

  .ed-checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .ed-checkbox-row label { font-size: 12px; color: var(--text-light); }

  /* PREVIEW DOCUMENT */
  .doc { width: 100%; max-width: 760px; background: var(--navy); border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; }
  .doc-header { padding: 56px 56px 40px; text-align: center; background: linear-gradient(180deg, var(--navy-dark), var(--navy)); }
  .doc-logo { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 15px; color: var(--blue); letter-spacing: 0.3em; margin-bottom: 4px; }
  .doc-logo-sub { font-size: 9px; color: var(--blue-light); letter-spacing: 0.5em; margin-bottom: 28px; }
  .doc-eyebrow { font-size: 11px; color: var(--blue); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 12px; }
  .doc-client { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 34px; color: #fff; line-height: 1.15; margin-bottom: 6px; }
  .doc-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
  .doc-periodo { font-size: 12px; color: var(--blue-light); margin-bottom: 22px; }
  .doc-intro { font-size: 14.5px; color: var(--text-light); line-height: 1.85; max-width: 560px; margin: 0 auto; font-weight: 300; white-space: pre-wrap; }

  .doc-stats { display: grid; gap: 12px; padding: 0 40px 40px; }
  .doc-stats-inner { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .doc-stat { flex: 1; min-width: 120px; background: rgba(77,168,240,0.06); border: 0.5px solid rgba(77,168,240,0.2); border-radius: 12px; padding: 18px 14px; text-align: center; }
  .doc-stat-value { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 26px; color: var(--blue-light); }
  .doc-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }

  .doc-section { padding: 32px 56px; border-top: 0.5px solid var(--border); }
  .doc-section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
  .doc-section-num { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 22px; color: rgba(77,168,240,0.35); }
  .doc-section-title { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 18px; color: #fff; }
  .doc-section-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; margin-left: 36px; }
  .doc-section-list { margin-left: 36px; display: flex; flex-direction: column; gap: 8px; }
  .doc-section-item { font-size: 13.5px; color: var(--text-light); padding-left: 18px; position: relative; }
  .doc-section-item::before { content: ''; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }

  .doc-pricing { padding: 32px 56px; border-top: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .doc-price-card { border-radius: 12px; padding: 18px 20px; border: 0.5px solid rgba(77,168,240,0.2); background: rgba(255,255,255,0.02); }
  .doc-price-card.highlight { background: linear-gradient(135deg, rgba(77,168,240,0.12), rgba(77,168,240,0.03)); border-color: rgba(77,168,240,0.4); }
  .doc-price-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .doc-price-name { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 15px; color: #fff; }
  .doc-price-value { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 17px; color: var(--blue-light); white-space: nowrap; }
  .doc-price-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }

  .doc-narrative { padding: 32px 56px; border-top: 0.5px solid var(--border); }
  .doc-narrative-title { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 17px; color: #fff; margin-bottom: 6px; }
  .doc-narrative-intro { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.7; }
  .doc-narrative-item { margin-bottom: 16px; }
  .doc-narrative-label { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--blue-light); margin-bottom: 4px; }
  .doc-narrative-text { font-size: 13px; color: var(--text-light); line-height: 1.75; font-weight: 300; }

  .doc-note { padding: 28px 56px; border-top: 0.5px solid var(--border); font-size: 12.5px; color: var(--text-muted); line-height: 1.8; white-space: pre-wrap; }

  .doc-clauses { padding: 32px 56px 40px; border-top: 0.5px solid var(--border); }
  .doc-clauses-title { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 15px; color: #fff; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 18px; }
  .doc-clause-item { display: flex; gap: 10px; margin-bottom: 14px; }
  .doc-clause-num { font-size: 12.5px; color: var(--blue); font-weight: 700; flex-shrink: 0; }
  .doc-clause-title { font-size: 12.5px; font-weight: 700; color: var(--text-light); margin-bottom: 3px; }
  .doc-clause-text { font-size: 12px; color: var(--text-muted); line-height: 1.7; }
  .doc-contract-note { font-size: 11.5px; color: #5a80a0; font-style: italic; margin-top: 16px; padding-top: 16px; border-top: 0.5px dashed rgba(77,168,240,0.2); line-height: 1.7; }

  .doc-footer { padding: 28px 56px 40px; text-align: center; border-top: 0.5px solid var(--border); }
  .doc-footer-text { font-size: 11px; color: #3a5a7a; letter-spacing: 0.08em; }

  .empty-hint { text-align: center; color: #3a5a7a; font-size: 13px; padding: 60px 20px; }

  /* CONTRACT DOCUMENT (bianco/nero, stile formale) */
  .contract-doc { width: 100%; max-width: 760px; background: #ffffff; color: #1a1a1a; padding: 56px 60px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); font-size: 13px; line-height: 1.65; }
  .ctr-logo { text-align: center; margin-bottom: 24px; }
  .ctr-logo .cl-main { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 16px; color: var(--blue-dark); letter-spacing: 0.3em; }
  .ctr-logo .cl-sub { font-size: 9px; color: #6a8aa8; letter-spacing: 0.4em; }
  .ctr-title { text-align: center; font-weight: 700; font-size: 14px; margin-bottom: 22px; text-transform: uppercase; }
  .ctr-parties p { margin-bottom: 10px; }
  .ctr-art-title { font-weight: 700; font-size: 13.5px; margin: 22px 0 10px; }
  .ctr-p { margin-bottom: 10px; }
  .ctr-list { margin: 8px 0 14px 22px; }
  .ctr-list li { margin-bottom: 8px; }
  .ctr-sign { display: flex; justify-content: space-between; margin-top: 50px; gap: 40px; }
  .ctr-sign-line { flex: 1; }
  .ctr-sign-line .sl-label { font-size: 12px; margin-bottom: 30px; }
  .ctr-sign-line .sl-rule { border-top: 1px solid #999; padding-top: 4px; font-size: 11px; color: #666; }
  .ctr-date { margin-top: 30px; font-size: 12.5px; }
  .ctr-page { text-align: center; font-size: 10px; color: #999; margin-top: 30px; }

  @media print {
    body { background: #fff; }
    .topbar, .editor-pane, .view-toggle, .doc-tabs, .history-overlay { display: none !important; }
    .layout { grid-template-columns: 1fr; }
    .preview-pane-wrap { max-height: none; }
    .preview-pane { padding: 0; max-height: none; background: #fff; }
    .doc { box-shadow: none; max-width: 100%; border-radius: 0; }
    .contract-doc { box-shadow: none; max-width: 100%; padding: 20px 10px; }
  }

  @media (max-width: 640px) {
    .doc-header, .doc-section, .doc-pricing, .doc-narrative, .doc-note, .doc-footer { padding-left: 24px; padding-right: 24px; }
    .doc-section-sub, .doc-section-list { margin-left: 0; }
    .contract-doc { padding: 32px 22px; }
    .ctr-sign { flex-direction: column; gap: 24px; }
  }

  /* PASSWORD GATE */
  .pw-overlay { position: fixed; inset: 0; background: var(--navy-dark); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .pw-card { max-width: 340px; width: 100%; text-align: center; }
  .pw-logo { font-family: 'Raleway', sans-serif; font-weight: 900; font-size: 18px; color: var(--blue); letter-spacing: 0.3em; margin-bottom: 4px; }
  .pw-logo-sub { font-size: 9px; color: var(--blue-light); letter-spacing: 0.5em; margin-bottom: 28px; }
  .pw-label { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
  .pw-input { width: 100%; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(77,168,240,0.3); color: #fff; border-radius: 10px; padding: 13px 16px; font-size: 15px; text-align: center; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 14px; letter-spacing: 0.1em; }
  .pw-input:focus { border-color: var(--blue); }
  .pw-btn { width: 100%; background: var(--blue); color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s; }
  .pw-btn:hover { background: var(--blue-dark); }
  .pw-error { color: #ff8a8a; font-size: 12.5px; margin-top: 12px; min-height: 16px; }
  @media print { .pw-overlay { display: none !important; } }

  /* HISTORY MODAL */
  .history-overlay { position: fixed; inset: 0; background: rgba(6,15,28,0.85); z-index: 900; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .history-card { background: var(--navy-dark); border: 0.5px solid rgba(77,168,240,0.3); border-radius: 16px; max-width: 560px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
  .history-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 0.5px solid var(--border); }
  .history-title { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 15px; color: #fff; }
  .history-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
  .history-list { overflow-y: auto; padding: 12px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 10px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px; }
  .history-item:hover { background: rgba(77,168,240,0.1); }
  .history-item-info .hi-name { font-size: 14px; font-weight: 600; color: #fff; }
  .history-item-info .hi-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .history-item-tag { font-size: 10.5px; color: var(--blue-light); background: rgba(77,168,240,0.12); padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
  .history-empty { text-align: center; color: #3a5a7a; font-size: 13px; padding: 40px 20px; }
</style>
</head>
<body>

<div class="pw-overlay" id="pwOverlay">
  <div class="pw-card">
    <div class="pw-logo">AMIRA</div>
    <div class="pw-logo-sub">vision</div>
    <div class="pw-label">Area riservata — inserisci la password per continuare</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="Password" autocomplete="off" />
    <button class="pw-btn" onclick="checkPassword()">Accedi</button>
    <div class="pw-error" id="pwError"></div>
  </div>
</div>

<div class="topbar">
  <div class="topbar-title">
    <div class="tt-main">GENERATORE PREVENTIVI</div>
    <div class="tt-sub">Amira Vision · strumento interno, non per i clienti</div>
  </div>
  <div class="topbar-actions">
    <div class="view-toggle">
      <button class="tb-btn" onclick="setMobileView('edit')">✏️ Modifica</button>
      <button class="tb-btn" onclick="setMobileView('preview')">👁 Anteprima</button>
    </div>
    <select class="ed-select" style="width:auto;" id="templateSelect" onchange="loadTemplate(this.value)">
      <option value="">Parti da un modello…</option>
      <optgroup label="Fotografia">
        <option value="foto-brand">Foto — Brand & Prodotto</option>
        <option value="foto-ritratti">Foto — Ritratti Professionali</option>
        <option value="foto-eventi">Foto — Reportage Eventi</option>
        <option value="foto-editoriale">Foto — Editoriale / Moda</option>
      </optgroup>
      <optgroup label="Video">
        <option value="video-corporate">Video — Corporate / Istituzionale</option>
        <option value="video-spot">Video — Spot Pubblicitario</option>
        <option value="video-podcast">Video — Podcast</option>
        <option value="video-intervista">Video — Intervista / Documentario</option>
      </optgroup>
      <optgroup label="Contenuti Social">
        <option value="social-essenziale">Social — Essenziale</option>
        <option value="social-standard">Social — Standard</option>
        <option value="social-completo">Social — Completo</option>
        <option value="social-full">Social — Full Service</option>
      </optgroup>
      <optgroup label="Altri modelli">
        <option value="editoriale">Piano editoriale (interviste + reel + AI)</option>
        <option value="sessione">Sessione professionisti (unica sessione)</option>
      </optgroup>
      <option value="vuoto">Vuoto</option>
    </select>
    <button class="tb-btn" onclick="document.getElementById('importFile').click()">Importa</button>
    <input type="file" id="importFile" accept="application/json" onchange="importData(event)" />
    <button class="tb-btn" onclick="exportData()">Esporta dati</button>
    <button class="tb-btn" onclick="saveToArchive()" id="saveArchiveBtn">💾 Salva nello storico</button>
    <button class="tb-btn" onclick="openHistory()">🕘 Cronologia</button>
    <button class="tb-btn primary" onclick="window.print()">Stampa / Salva PDF</button>
  </div>
</div>

<div class="history-overlay" id="historyOverlay" style="display:none;">
  <div class="history-card">
    <div class="history-head">
      <div class="history-title">Cronologia preventivi</div>
      <button class="history-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="layout">
  <div class="editor-pane" id="editorPane"></div>
  <div class="preview-pane-wrap">
    <div class="doc-tabs">
      <button class="doc-tab active" id="tabProposta" onclick="setDocView('proposta')">📄 Proposta</button>
      <button class="doc-tab" id="tabContratto" onclick="setDocView('contratto')">📝 Contratto</button>
    </div>
    <div class="preview-pane" id="previewPane"></div>
  </div>
</div>

<script>
/* ===========================================================
   GENERATORE PREVENTIVI — Amira Vision
   Strumento interno: nessun dato viene inviato altrove.
   Tutto resta nel browser finché non esporti/stampi.
=========================================================== */

let STATE = emptyState();
let currentView = 'proposta'; // 'proposta' | 'contratto'

function emptyState() {
  return {
    client: { eyebrow: 'Pacchetto contenuti mensile', nome: '', sottotitolo: '', periodo: '', intro: '' },
    stats: [],
    sections: [],
    pricing: [],
    narrativeBlocks: [],
    clauses: [],
    contractNote: '',
    note: '',
    footer: 'Foto · Video · Reel — Amira Vision',
    contract: defaultContract()
  };
}

function defaultContract() {
  return {
    tipoContratto: 'gestione', // 'gestione' (social continuativo) | 'produzione' (foto/video una tantum)
    clienteNome: '', clienteSede: '', clientePIVA: '', clientePEC: '', clienteTelefono: '',
    fornitoreNome: 'Amirante Francesco',
    fornitoreSede: 'Via Michelangelo da Caravaggio, 76 - 80126 Napoli',
    fornitorePIVA: '10582821210',
    fornitorePEC: 'francescoamirante@pec.it',
    fornitoreTelefono: '+39 3202412048',
    contenutiSettimana: '4',
    giorniPubblicazione: 'lunedì, mercoledì, venerdì e domenica',
    contenutiMeseMax: '16',
    tipiContenuto: 'video in formato Reel (della durata massima di 1:30 minuti), fotografie, caroselli fotografici o post con grafiche in sovrimpressione',
    canali: 'Instagram e TikTok',
    shootingFrequenza: 'una giornata di shooting all\'inizio di ciascun ciclo mensile',
    oggettoExtra: [],
    durataMinima: '3 (tre) mesi',
    oggettoProduzioneTesto: 'Il Fornitore si impegna a realizzare per il Cliente il servizio concordato, comprensivo di ripresa/scatto e post-produzione, secondo lo stile e le indicazioni condivise tra le parti, con consegna del materiale finale in formato digitale ad alta risoluzione.',
    durataProduzioneTesto: 'Il presente contratto decorre dalla data di sottoscrizione e si intende concluso con la consegna del materiale finale, prevista entro [X] giorni lavorativi dalla data dello shooting/delle riprese, salvo revisioni concordate tra le parti.',
    compensoTotale: '',
    milestones: [
      { id: uid(), importo: '', quando: 'al termine della giornata di shooting' },
      { id: uid(), importo: '', quando: 'alla consegna del materiale realizzato, dopo l\'eventuale revisione richiesta dal Cliente' },

  const state = Object.assign(emptyState(), overrides);
  if (overrides && overrides.contract) {
    state.contract = Object.assign(defaultContract(), overrides.contract);

  return state;
}

function loadTemplate(key) {
  if (!key) return;
  STATE = TEMPLATES[key] ? TEMPLATES[key]() : emptyState();
  document.getElementById('templateSelect').value = '';
  renderForm();
  renderPreview();
}

/* ---------------- IMPORT / EXPORT ---------------- */
function exportData() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (STATE.client.nome || 'preventivo').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  a.href = url;
  a.download = 'preventivo-' + safeName + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      STATE = Object.assign(emptyState(), data);
      renderForm();
      renderPreview();
    } catch (err) {
      alert('File non valido: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function saveToArchive() {
  const btn = document.getElementById('saveArchiveBtn');
  if (!archiveConfigured()) {
    alert('Archivio non ancora collegato.\n\nConfigura prima ARCHIVE_WEBHOOK_URL nel file (vedi istruzioni in google-apps-script-ARCHIVIO.gs), poi riprova.');
    return;
  }
  const clienteNome = STATE.client.nome || STATE.contract.clienteNome || '(senza nome)';
  const tipoDocumento = currentView === 'contratto' ? 'Contratto' : 'Proposta';

  const formData = new FormData();
  formData.append('ClienteNome', clienteNome);
  formData.append('TipoDocumento', tipoDocumento);
  formData.append('Dati', JSON.stringify(STATE));

  const originalText = btn.textContent;
  btn.textContent = 'Salvataggio…';
  btn.disabled = true;

  const finish = () => {
    btn.textContent = '✓ Salvato';
    setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 1800);
  };

  fetch(ARCHIVE_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: formData })
    .then(finish)
    .catch(finish);
}

function openHistory() {
  const overlay = document.getElementById('historyOverlay');
  const list = document.getElementById('historyList');
  overlay.style.display = 'flex';

  if (!archiveConfigured()) {
    list.innerHTML = `<div class="history-empty">Archivio non ancora collegato.<br>Configura ARCHIVE_WEBHOOK_URL nel file per iniziare a salvare e recuperare i preventivi.</div>`;
    return;
  }

  list.innerHTML = `<div class="history-empty">Caricamento…</div>`;

  fetch(ARCHIVE_WEBHOOK_URL)
    .then(r => r.json())
    .then(data => {
      if (!data.items || !data.items.length) {
        list.innerHTML = `<div class="history-empty">Nessun preventivo salvato ancora. Usa "💾 Salva nello storico" per iniziare ad archiviarli.</div>`;
        return;
      }
      window._historyItems = data.items;
      list.innerHTML = data.items.map((item, i) => `
        <div class="history-item" onclick="loadHistoryItem(${i})">
          <div class="history-item-info">
            <div class="hi-name">${esc(item.clienteNome || '(senza nome)')}</div>
            <div class="hi-meta">${esc(item.timestamp)}</div>
          </div>
          <div class="history-item-tag">${esc(item.tipoDocumento)}</div>
        </div>`).join('');
    })
    .catch(err => {
      list.innerHTML = `<div class="history-empty">Errore nel caricamento: ${esc(err.message)}</div>`;
    });
}

function closeHistory() {
  document.getElementById('historyOverlay').style.display = 'none';
}

function loadHistoryItem(index) {
  const item = window._historyItems[index];
  if (!item) return;
  try {
    const data = JSON.parse(item.dati);
    STATE = Object.assign(emptyState(), data);
    closeHistory();
    renderForm();
    renderPreview();
  } catch (err) {
    alert('Impossibile aprire questo preventivo: ' + err.message);
  }
}

function block(title, innerHtml) {
  const wrap = document.createElement('div');
  wrap.className = 'ed-block';
  wrap.innerHTML = `<div class="ed-block-title">${title}</div>${innerHtml}`;
  return wrap;
}

function esc(str) {
  return (str || '').toString().replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------------- BINDINGS ---------------- */
function attachBindings() {
  document.querySelectorAll('[data-bind]').forEach(input => {
    const evt = input.tagName === 'SELECT' || input.type === 'checkbox' ? 'change' : 'input';
    input.addEventListener(evt, () => {
      const path = input.getAttribute('data-bind');
      const isList = input.getAttribute('data-list') === 'true';
      const isCheckbox = input.getAttribute('data-checkbox') === 'true';
      const value = isCheckbox ? input.checked : (isList ? input.value.split('\\n').filter(Boolean) : input.value);
      setByPath(path, value);
      renderPreview();
    });
  });
}

function setByPath(path, value) {
  const parts = path.split('.');
  if (parts[0] === 'client') { STATE.client[parts[1]] = value; return; }
  if (parts[0] === 'note' || parts[0] === 'footer' || parts[0] === 'contractNote') { STATE[parts[0]] = value; return; }
  if (parts[0] === 'stats' || parts[0] === 'sections' || parts[0] === 'pricing' || parts[0] === 'clauses') {
    const arr = STATE[parts[0]];
    const item = arr.find(x => x.id === parts[1]);
    if (item) item[parts[2]] = value;
    return;
  }
  if (parts[0] === 'narrativeBlocks') {
    const block = STATE.narrativeBlocks.find(x => x.id === parts[1]);
    if (!block) return;
    if (parts[2] === 'items') {
      const it = block.items.find(x => x.id === parts[3]);
      if (it) it[parts[4]] = value;
    } else {
      block[parts[2]] = value;
    }
  }
  if (parts[0] === 'contract') {
    const ct = STATE.contract;
    if (parts[1] === 'milestones' || parts[1] === 'variePersonalizzate') {
      const arr = ct[parts[1]];
      const item = arr.find(x => x.id === parts[2]);
      if (item) item[parts[3]] = value;
    } else {
      ct[parts[1]] = value;
    }
  }
}

/* ---------------- ADD / REMOVE ---------------- */
function addStat() { STATE.stats.push({ id: uid(), value: '', label: '' }); renderForm(); renderPreview(); }
function addSection() { STATE.sections.push({ id: uid(), numero: String(STATE.sections.length + 1).padStart(2, '0'), titolo: '', sottotitolo: '', voci: [] }); renderForm(); renderPreview(); }
function addPricing() { STATE.pricing.push({ id: uid(), nome: '', prezzo: '', descrizione: '', evidenziato: false }); renderForm(); renderPreview(); }
function addNarrativeBlock() { STATE.narrativeBlocks.push({ id: uid(), titolo: '', intro: '', items: [] }); renderForm(); renderPreview(); }
function addNarrativeSubItem(blockId) {
  const b = STATE.narrativeBlocks.find(x => x.id === blockId);
  if (b) b.items.push({ id: uid(), label: '', testo: '' });
  renderForm(); renderPreview();
}
function addClause() { STATE.clauses.push({ id: uid(), titolo: '', testo: '' }); renderForm(); renderPreview(); }
function addClauseFromLibrary() {
  const sel = document.getElementById('clauseLibrarySelect');
  const idx = sel.value;
  if (idx === '') return;
  const c = CLAUSE_LIBRARY[Number(idx)];
  STATE.clauses.push({ id: uid(), titolo: c.titolo, testo: c.testo });
  renderForm(); renderPreview();
}
function addMilestone() { STATE.contract.milestones.push({ id: uid(), importo: '', quando: '' }); renderForm(); renderPreview(); }
function setContractType(v) { STATE.contract.tipoContratto = v; renderForm(); renderPreview(); }
function addVarieClause() { STATE.contract.variePersonalizzate.push({ id: uid(), testo: '' }); renderForm(); renderPreview(); }
function removeContractSub(key, id) {
  STATE.contract[key] = STATE.contract[key].filter(x => x.id !== id);
  renderForm(); renderPreview();
}
function removeItem(key, id) {
  STATE[key] = STATE[key].filter(x => x.id !== id);
  renderForm(); renderPreview();
}
function removeSubItem(blockId, itemId) {
  const b = STATE.narrativeBlocks.find(x => x.id === blockId);
  if (b) b.items = b.items.filter(x => x.id !== itemId);
  renderForm(); renderPreview();
}

/* ---------------- PREVIEW RENDER ---------------- */
function setDocView(view) {
  currentView = view;
  document.getElementById('tabProposta').classList.toggle('active', view === 'proposta');
  document.getElementById('tabContratto').classList.toggle('active', view === 'contratto');
  renderPreview();
}

function renderPreview() {
  if (currentView === 'contratto') { renderContractPreview(); return; }
  renderProposalPreview();
}

function renderProposalPreview() {
  const el = document.getElementById('previewPane');
  const c = STATE.client;

  const isEmpty = !c.nome && !STATE.sections.length && !STATE.pricing.length && !STATE.narrativeBlocks.length && !STATE.stats.length;

  if (isEmpty) {
    el.innerHTML = `<div class="doc"><div class="empty-hint">Inizia a compilare a sinistra, oppure scegli un modello dal menù in alto — l'anteprima si aggiorna in automatico.</div></div>`;
    return;
  }

  const statsHtml = STATE.stats.length ? `
    <div class="doc-stats"><div class="doc-stats-inner">
      ${STATE.stats.map(s => `<div class="doc-stat"><div class="doc-stat-value">${esc(s.value)}</div><div class="doc-stat-label">${esc(s.label)}</div></div>`).join('')}
    </div></div>` : '';

  const sectionsHtml = STATE.sections.map(s => `
    <div class="doc-section">
      <div class="doc-section-head"><div class="doc-section-num">${esc(s.numero)}</div><div class="doc-section-title">${esc(s.titolo)}</div></div>
      ${s.sottotitolo ? `<div class="doc-section-sub">${esc(s.sottotitolo)}</div>` : ''}
      <div class="doc-section-list">${(s.voci || []).map(v => `<div class="doc-section-item">${esc(v)}</div>`).join('')}</div>
    </div>`).join('');

  const pricingHtml = STATE.pricing.length ? `
    <div class="doc-pricing">
      ${STATE.pricing.map(p => `
        <div class="doc-price-card ${p.evidenziato ? 'highlight' : ''}">
          <div class="doc-price-top"><div class="doc-price-name">${esc(p.nome)}</div><div class="doc-price-value">${esc(p.prezzo)}</div></div>
          ${p.descrizione ? `<div class="doc-price-desc">${esc(p.descrizione)}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  const narrativeHtml = STATE.narrativeBlocks.map(n => `
    <div class="doc-narrative">
      <div class="doc-narrative-title">${esc(n.titolo)}</div>
      ${n.intro ? `<div class="doc-narrative-intro">${esc(n.intro)}</div>` : ''}
      ${(n.items || []).map(it => `
        <div class="doc-narrative-item">
          ${it.label ? `<div class="doc-narrative-label">${esc(it.label)}</div>` : ''}
          <div class="doc-narrative-text">${esc(it.testo)}</div>
        </div>`).join('')}
    </div>`).join('');

  const noteHtml = STATE.note ? `<div class="doc-note">${esc(STATE.note)}</div>` : '';

  const clausesHtml = STATE.clauses.length ? `
    <div class="doc-clauses">
      <div class="doc-clauses-title">Termini e Condizioni</div>
      ${STATE.clauses.map((cl, i) => `
        <div class="doc-clause-item">
          <div class="doc-clause-num">${i + 1}.</div>
          <div>
            ${cl.titolo ? `<div class="doc-clause-title">${esc(cl.titolo)}</div>` : ''}
            <div class="doc-clause-text">${esc(cl.testo)}</div>
          </div>
        </div>`).join('')}
      ${STATE.contractNote ? `<div class="doc-contract-note">${esc(STATE.contractNote)}</div>` : ''}
    </div>` : (STATE.contractNote ? `<div class="doc-clauses"><div class="doc-contract-note">${esc(STATE.contractNote)}</div></div>` : '');

  el.innerHTML = `
    <div class="doc">
      <div class="doc-header">
        <div class="doc-logo">AMIRA</div>
        <div class="doc-logo-sub">vision</div>
        ${c.eyebrow ? `<div class="doc-eyebrow">${esc(c.eyebrow)}</div>` : ''}
        <div class="doc-client">${esc(c.nome) || 'Nome Cliente'}</div>
        ${c.sottotitolo ? `<div class="doc-sub">${esc(c.sottotitolo)}</div>` : ''}
        ${c.periodo ? `<div class="doc-periodo">${esc(c.periodo)}</div>` : ''}
        ${c.intro ? `<div class="doc-intro">${esc(c.intro)}</div>` : ''}
      </div>
      ${statsHtml}
      ${sectionsHtml}
      ${pricingHtml}
      ${narrativeHtml}
      ${noteHtml}
      ${clausesHtml}
      <div class="doc-footer"><div class="doc-footer-text">${esc(STATE.footer)}</div></div>
    </div>
  `;
}

  const c = STATE.client;

  const milestonesTxt = ct.milestones.filter(m => m.importo || m.quando)

  const varieTxt = ct.variePersonalizzate.filter(v => v.testo).map(v => `<li>${esc(v.testo)}</li>`).join('');

      `I contenuti potranno consistere in ${esc(ct.tipiContenuto)}.`,
      `Effettuare ${esc(ct.shootingFrequenza)}, finalizzata alla produzione dei materiali sopra indicati.`,
      `Fornire il servizio di montaggio video e creazione dei contenuti, seguendo lo stile di comunicazione concordato tra le parti.`,
      `Curare la pubblicazione dei contenuti nei giorni stabiliti, sui canali <strong>${esc(ct.canali)}</strong> del Cliente.`,
      ...(ct.oggettoExtra || []).map(v => esc(v))

    articles.push({

      body: `<p class="ctr-p"><strong>Il Fornitore si impegna a:</strong></p><ul class="ctr-list">${oggettoVoci.map(v => `<li>${v}</li>`).join('')}</ul>`
    });
    articles.push({
      title: 'Durata del Contratto',
      body: `
        <p class="ctr-p">Il presente contratto decorre dalla data di sottoscrizione e ha una <strong>durata minima di ${esc(ct.durataMinima)}</strong>, suddivisa in cicli mensili. Durante ciascun ciclo mensile verranno prodotti e pubblicati un massimo di ${esc(ct.contenutiMeseMax)} contenuti, secondo quanto previsto all'articolo precedente.</p>
        <p class="ctr-p">All'inizio di ciascun ciclo sarà effettuata ${esc(ct.shootingFrequenza)}.</p>
        <p class="ctr-p">Al termine del periodo minimo, il contratto si intenderà tacitamente rinnovato di mese in mese, salvo disdetta comunicata da una delle parti con almeno 30 giorni di preavviso rispetto alla scadenza.</p>`

  articles.push({
    title: 'Compenso e Modalità di Pagamento',

      <ul class="ctr-list">${milestonesTxt}</ul>
      <p class="ctr-p"><strong>Obbligo di pagamento:</strong> il Cliente è tenuto a corrispondere l'intero importo pattuito, senza possibilità di riduzione, sospensione o rimborso, anche in caso di interruzione anticipata della collaborazione o mancato utilizzo dei contenuti da parte del Cliente.</p>

  });

  articles.push({ title: 'Obblighi e Responsabilità del Fornitore', body: `<p class="ctr-p" style="white-space:pre-wrap;">${esc(ct.obblighiFornitoreTesto)}</p>` });
  articles.push({ title: 'Obblighi del Cliente', body: `<p class="ctr-p" style="white-space:pre-wrap;">${esc(ct.obblighiClienteTesto)}</p>` });

  if (!isProduzione) {

  articles.push({ title: 'Riservatezza e Trattamento dei Dati', body: `<p class="ctr-p" style="white-space:pre-wrap;">${esc(ct.riservatezzaTesto)}</p>` });
  articles.push({ title: 'Comunicazioni Ufficiali', body: `<p class="ctr-p">${esc(ct.comunicazioniTesto)}</p>` });
  articles.push({ title: 'Risoluzione del Contratto', body: `<p class="ctr-p">${esc(ct.risoluzioneTesto)}</p>` });
  articles.push({ title: 'Controversie', body: `<p class="ctr-p">${esc(ct.controversieTesto)}</p>` });
  articles.push({ title: 'Varie', body: `<ul class="ctr-list">${varieTxt}</ul>` });

  const articlesHtml = articles.map((a, i) => `
    <div class="ctr-art-title">${i + 1}. ${a.title}</div>

  el.innerHTML = `
    <div class="contract-doc">
      <div class="ctr-logo"><div class="cl-main">AMIRA</div><div class="cl-sub">vision</div></div>

  const input = document.getElementById('pwInput');

  if (input.value === PAGE_PASSWORD) {
    document.getElementById('pwOverlay').style.display = 'none';
    renderForm();

    error.textContent = 'Password errata, riprova.';
